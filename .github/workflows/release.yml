name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build app, ZIP and DMG
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          scripts/make-dmg.sh
          codesign -dv build/BrowserBro.app

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/__VERSION__/$VERSION/g" .github/release-notes.md > build/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "BrowserBro $VERSION" \
            --notes-file build/notes.md \
            --verify-tag \
            "build/BrowserBro-$VERSION.zip" "build/BrowserBro-$VERSION.zip.sha256" \
            "build/BrowserBro-$VERSION.dmg" "build/BrowserBro-$VERSION.dmg.sha256" \
            build/BrowserBro.zip build/BrowserBro.zip.sha256 \
            build/BrowserBro.dmg build/BrowserBro.dmg.sha256
